  <!-- superficie elevada -->
  <rect x="250" y="180" width="110" height="20" rx="4" fill="#4A3223"/>
  <rect x="250" y="140" width="110" height="40" rx="6" fill="#EAE0CB" stroke="#4A3223" stroke-width="4"/>
  <!-- rampa -->
  <path d="M60 300 L250 200 L250 220 L82 300 Z" fill="#BD8A34"/>
  <path d="M60 300 L250 200" stroke="#4A3223" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- pata de apoyo de la rampa -->
  <line x1="150" y1="252" x2="150" y2="300" stroke="#4A3223" stroke-width="4" stroke-linecap="round"/>
  <!-- silueta de perro subiendo -->
  <g transform="translate(95,232) rotate(-24)">
    <ellipse cx="30" cy="14" rx="26" ry="14" fill="#4A3223"/>
    <circle cx="54" cy="6" r="10" fill="#4A3223"/>
    <rect x="4" y="20" width="6" height="16" rx="3" fill="#4A3223"/>
    <rect x="46" y="20" width="6" height="16" rx="3" fill="#4A3223"/>
  </g>
</svg>
